name: Vista previa

# Despliega el cliente de cada PR en Cloudflare Pages (sin ranking ni anuncios)
# y deja la URL en un comentario. Los PR de forks no reciben secretos: se omiten.

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  preview:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Comprobar secretos
        id: cfg
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "Faltan CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID: sin vista previa."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.cfg.outputs.ok == 'true'
      - uses: actions/setup-node@v4
        if: steps.cfg.outputs.ok == 'true'
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        if: steps.cfg.outputs.ok == 'true'
      # Sin VITE_RANKING ni VITE_AD_*: el juego queda local y sin anuncios.
      - run: npm run build
        if: steps.cfg.outputs.ok == 'true'
      - name: Desplegar en Cloudflare Pages
        if: steps.cfg.outputs.ok == 'true'
        id: deploy
        run: |
          npx --yes wrangler@4 pages deploy dist \
            --project-name=pilecrawl-preview \
            --branch="pr-${{ github.event.pull_request.number }}" \
            --commit-hash="${{ github.event.pull_request.head.sha }}" \
            --commit-dirty=true
          echo "url=https://pr-${{ github.event.pull_request.number }}.pilecrawl-preview.pages.dev" >> "$GITHUB_OUTPUT"
      - name: Comentar la URL
        if: steps.cfg.outputs.ok == 'true'
        uses: actions/github-script@v7
        env:
          PREVIEW_URL: ${{ steps.deploy.outputs.url }}
        with:
          script: |
            const marker = '<!-- vista-previa -->';
            const sha = context.payload.pull_request.head.sha.slice(0, 7);
            const body = `${marker}\n**Vista previa** (sin ranking ni anuncios): ${process.env.PREVIEW_URL}\n\nCommit ${sha}.`;
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const mine = comments.find(c => c.body && c.body.startsWith(marker));
            if (mine) await github.rest.issues.updateComment({ owner, repo, comment_id: mine.id, body });
            else await github.rest.issues.createComment({ owner, repo, issue_number, body });
