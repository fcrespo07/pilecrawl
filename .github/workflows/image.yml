name: Imagen

# Construye la imagen del juego y el servidor. En los PR solo comprueba que se construye (amd64, rápido);
# al llegar a master construye la de la Raspberry Pi (arm64) y la sube a GitHub Container Registry.
# Usa solo el GITHUB_TOKEN del repositorio: no hace falta ningún secreto.
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: false
          build-args: |
            VITE_RANKING=1

  publish:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:latest
            ${{ steps.meta.outputs.image }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VITE_RANKING=1
            VITE_AD_PROVIDER=${{ vars.VITE_AD_PROVIDER }}
            VITE_AD_CLIENT=${{ vars.VITE_AD_CLIENT }}
            VITE_AD_SLOT=${{ vars.VITE_AD_SLOT }}
            VITE_AD_CONSENT=${{ vars.VITE_AD_CONSENT }}
            VITE_PRIVACY_URL=${{ vars.VITE_PRIVACY_URL }}
