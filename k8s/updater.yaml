# Actualización automática: cada 5 minutos pregunta a GitHub Container Registry si la imagen `latest`
# ha cambiado y, si es así, reinicia el Deployment (que baja la nueva: imagePullPolicy Always).
# Si la imagen nueva no llega a arrancar (progressDeadlineSeconds), vuelve a la última que funcionó y no
# reintenta ese digest. Es la Pi la que pregunta hacia fuera; no hay que abrirle nada a GitHub ni guardar ningún secreto.
# Requisito: el paquete de la imagen en GHCR debe ser público. Cliente y servidor van en la misma imagen,
# así que un cambio de reglas (RULES_VERSION) se despliega siempre completo.
# Para pararlo: kubectl -n blockrogue patch cronjob blockrogue-updater -p '{"spec":{"suspend":true}}'
apiVersion: v1
kind: ServiceAccount
metadata:
  name: blockrogue-updater
  namespace: blockrogue
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: blockrogue-updater
  namespace: blockrogue
rules:
  # solo leer y modificar su propio Deployment, nada más
  - apiGroups: ["apps"]
    resources: ["deployments"]
    resourceNames: ["blockrogue"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: blockrogue-updater
  namespace: blockrogue
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: blockrogue-updater
subjects:
  - kind: ServiceAccount
    name: blockrogue-updater
    namespace: blockrogue
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: blockrogue-updater
  namespace: blockrogue
spec:
  schedule: "*/5 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 60
      template:
        spec:
          serviceAccountName: blockrogue-updater
          restartPolicy: Never
          automountServiceAccountToken: true # solo este pod necesita hablar con la API
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            seccompProfile: { type: RuntimeDefault }
          containers:
            - name: updater
              # la misma imagen que el juego (lleva updater.mjs); cambia el nombre si renombras el repositorio
              image: ghcr.io/fcrespo07/tetris-roguelite:latest
              imagePullPolicy: Always
              command: ["node", "--disable-warning=ExperimentalWarning", "updater.mjs"]
              env:
                # certificado del clúster para hablar con la API de Kubernetes
                - name: NODE_EXTRA_CA_CERTS
                  value: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
              resources:
                requests: { cpu: 10m, memory: 48Mi }
                limits: { cpu: 200m, memory: 128Mi }
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: { drop: [ALL] }
