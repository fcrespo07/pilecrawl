<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Estadísticas · Pilecrawl</title>
    <link rel="stylesheet" href="/src/legal.css" />
    <style>
      main { max-width: 1000px; }
      table { border-collapse: collapse; width: 100%; font-size: 15px; margin: 8px 0 24px; }
      th, td { text-align: right; padding: 3px 8px; border-bottom: 1px solid #2a3157; }
      th:first-child, td:first-child { text-align: left; }
      th { color: #9aa3c7; font-weight: normal; cursor: pointer; }
      form, .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin: 12px 0; }
      input, select, button { font: inherit; padding: 4px 8px; background: #1c2240; color: inherit; border: 1px solid #3a4375; border-radius: 4px; }
      .pos { color: #7fe0a0; } .neg { color: #ff8f8f; }
      .bar { display: inline-block; height: 10px; background: #4a6cf0; vertical-align: middle; }
      #err { color: #ff8f8f; }
    </style>
  </head>
  <body>
    <main>
      <h1>Estadísticas anónimas</h1>
      <p class="note">Solo para el responsable. Necesita la clave de administrador (<code>ADMIN_TOKEN</code>); se guarda solo en esta pestaña.</p>
      <form id="f">
        <input id="token" type="password" placeholder="Clave" autocomplete="off" />
        <select id="days"><option value="7">7 días</option><option value="30" selected>30 días</option><option value="400">Todo</option></select>
        <select id="mode"></select>
        <input id="rules" type="number" min="0" placeholder="Reglas (todas)" style="width: 9em" />
        <button>Ver</button>
      </form>
      <p id="err"></p>
      <div id="out"></div>
    </main>
    <script type="module" src="/src/statspage.ts"></script>
  </body>
</html>
